substitutions:
  device_name: m5stack-tough
  friendly_name: M5Stack Tough
  # RS485/Modbus configuration
  modbus_address: "0x01"  # Zeversolar inverter address

esphome:
  name: ${device_name}
  platformio_options:
    board_build.partitions: huge_app.csv

  # Boot sequence with splash screen
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - logger.log: "Starting Zeversolar TLC5000 Monitor"
      - display.page.show: splash_page
      - delay: 3s
      - display.page.show: main_page

esp32:
  board: m5stack-core-esp32
  framework:
    type: arduino

# Enable logging but disable UART logging (needed for Modbus)
logger:
  level: INFO
  baud_rate: 0  # Disable UART logging to free up UART for Modbus

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Show WiFi connection status
  on_connect:
    then:
      - logger.log: "WiFi Connected"
  on_disconnect:
    then:
      - logger.log: "WiFi Disconnected"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# I2C Bus Configuration
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

# SPI Bus for Display
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO38

# UART configuration for RS485/Modbus communication with Zeversolar inverter
uart:
  id: modbus_uart
  tx_pin: GPIO14  # RS485 TX
  rx_pin: GPIO13  # RS485 RX
  baud_rate: 9600
  stop_bits: 1
  parity: NONE
  data_bits: 8

# Modbus configuration
modbus:
  id: modbus1
  uart_id: modbus_uart

# Modbus controller for Zeversolar TLC5000
modbus_controller:
  - id: zeversolar
    address: 0x01
    modbus_id: modbus1
    setup_priority: -10
    command_throttle: 200ms
    update_interval: 30s

# Power Management & Buttons
binary_sensor:
  # Power Button
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "${friendly_name} Power Button"
    on_press:
      then:
        - logger.log: "Power button pressed"
        - display.page.show_next: m5_display

  # Touch Button 1 (Bottom Left) - Previous Page
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
    name: "${friendly_name} Button 1"
    on_press:
      then:
        - display.page.show_previous: m5_display

  # Touch Button 2 (Bottom Center) - Toggle backlight
  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: "${friendly_name} Button 2"

  # Touch Button 3 (Bottom Right) - Next Page
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    name: "${friendly_name} Button 3"
    on_press:
      then:
        - display.page.show_next: m5_display

  # Inverter Status (from Modbus)
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Inverter Status"
    id: inverter_status
    register_type: holding
    address: 0x0010
    bitmask: 0x0001

# Sensors
sensor:
  # === ZEVERSOLAR INVERTER SENSORS (via Modbus) ===

  # DC Input Measurements - PV String 1
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} PV1 Voltage"
    id: pv1_voltage
    register_type: holding
    address: 0x0000
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} PV1 Current"
    id: pv1_current
    register_type: holding
    address: 0x0001
    unit_of_measurement: "A"
    device_class: current
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # DC Input Measurements - PV String 2
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} PV2 Voltage"
    id: pv2_voltage
    register_type: holding
    address: 0x0002
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} PV2 Current"
    id: pv2_current
    register_type: holding
    address: 0x0003
    unit_of_measurement: "A"
    device_class: current
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # AC Output Measurements
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Grid Voltage"
    id: grid_voltage
    register_type: holding
    address: 0x0006
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Grid Current"
    id: grid_current
    register_type: holding
    address: 0x0007
    unit_of_measurement: "A"
    device_class: current
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Grid Frequency"
    id: grid_frequency
    register_type: holding
    address: 0x0008
    unit_of_measurement: "Hz"
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Power Output
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Current Power"
    id: current_power
    register_type: holding
    address: 0x0009
    unit_of_measurement: "W"
    device_class: power
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # Energy Totals
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Today Energy"
    id: today_energy
    register_type: holding
    address: 0x000C
    unit_of_measurement: "kWh"
    device_class: energy
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Total Energy"
    id: total_energy
    register_type: holding
    address: 0x000E
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Temperature
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "${friendly_name} Inverter Temperature"
    id: inverter_temp
    register_type: holding
    address: 0x0011
    unit_of_measurement: "°C"
    device_class: temperature
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - filter_out: 0

  # === M5STACK ONBOARD SENSORS ===

  # MPU6886 IMU Sensor
  - platform: mpu6050
    address: 0x68
    accel_x:
      name: "${friendly_name} Accel X"
      internal: true
    accel_y:
      name: "${friendly_name} Accel Y"
      internal: true
    accel_z:
      name: "${friendly_name} Accel Z"
      internal: true
    gyro_x:
      name: "${friendly_name} Gyro X"
      internal: true
    gyro_y:
      name: "${friendly_name} Gyro Y"
      internal: true
    gyro_z:
      name: "${friendly_name} Gyro Z"
      internal: true
    temperature:
      name: "${friendly_name} IMU Temperature"
      internal: true
    update_interval: 60s

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    internal: true

  # Uptime Sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    id: device_uptime
    update_interval: 60s

# Display Configuration with Solar Monitoring Pages
display:
  - platform: ili9xxx
    model: M5STACK
    id: m5_display
    cs_pin: GPIO5
    dc_pin: GPIO15
    reset_pin: GPIO4
    rotation: 0
    update_interval: 1s
    pages:
      # Splash screen shown during boot
      - id: splash_page
        lambda: |-
          // Splash screen with system info
          it.fill(Color(0, 0, 0));
          it.print(160, 40, id(font_large), id(color_green), TextAlign::CENTER,
                   "Solar Monitor");
          it.print(160, 100, id(font_medium), id(color_white), TextAlign::CENTER,
                   "Connecting to");
          it.print(160, 130, id(font_medium), id(color_white), TextAlign::CENTER,
                   "Zeversolar TLC5000");
          it.print(160, 200, id(font_small), id(color_gray), TextAlign::CENTER,
                   "System Starting...");

      # Main solar monitoring page
      - id: main_page
        lambda: |-
          // Main solar monitoring display
          // Clear screen with dark background
          it.fill(Color(10, 10, 20));

          // Title bar with gradient effect
          it.filled_rectangle(0, 0, 320, 30, id(color_header));
          it.print(160, 15, id(font_medium), id(color_white), TextAlign::CENTER,
                   "SOLAR MONITOR");

          // Draw divider lines for sections
          it.horizontal_line(0, 35, 320, id(color_gray));
          it.horizontal_line(0, 115, 320, id(color_gray));
          it.horizontal_line(0, 175, 320, id(color_gray));

          // === SOLAR INPUT SECTION (Top) ===
          it.print(10, 45, id(font_small), id(color_yellow), TextAlign::LEFT,
                   "SOLAR INPUT");

          // PV1 Statistics
          it.print(10, 65, id(font_small), id(color_white), TextAlign::LEFT,
                   "PV1:");
          it.printf(60, 65, id(font_small), id(color_green), TextAlign::LEFT,
                    "%.1fV", id(pv1_voltage).state);
          it.printf(120, 65, id(font_small), id(color_green), TextAlign::LEFT,
                    "%.2fA", id(pv1_current).state);
          float pv1_power = id(pv1_voltage).state * id(pv1_current).state;
          it.printf(180, 65, id(font_small), id(color_bright), TextAlign::LEFT,
                    "%.0fW", pv1_power);

          // PV2 Statistics
          it.print(10, 85, id(font_small), id(color_white), TextAlign::LEFT,
                   "PV2:");
          it.printf(60, 85, id(font_small), id(color_green), TextAlign::LEFT,
                    "%.1fV", id(pv2_voltage).state);
          it.printf(120, 85, id(font_small), id(color_green), TextAlign::LEFT,
                    "%.2fA", id(pv2_current).state);
          float pv2_power = id(pv2_voltage).state * id(pv2_current).state;
          it.printf(180, 85, id(font_small), id(color_bright), TextAlign::LEFT,
                    "%.0fW", pv2_power);

          // Total DC Power (larger, prominent)
          float total_dc = pv1_power + pv2_power;
          it.printf(250, 75, id(font_large), id(color_yellow), TextAlign::LEFT,
                    "%.0fW", total_dc);

          // === GRID OUTPUT SECTION (Middle) ===
          it.print(10, 125, id(font_small), id(color_cyan), TextAlign::LEFT,
                   "GRID OUTPUT");

          // Current Power Output (large and prominent)
          it.printf(10, 145, id(font_large), id(color_bright), TextAlign::LEFT,
                    "%.0f W", id(current_power).state);

          // Grid parameters
          it.printf(160, 145, id(font_small), id(color_white), TextAlign::LEFT,
                    "%.1fV @ %.2fHz", id(grid_voltage).state, id(grid_frequency).state);

          // Efficiency indicator with color coding
          float efficiency = 0;
          if (total_dc > 10) {
            efficiency = (id(current_power).state / total_dc) * 100.0;
          }

          // Choose color based on efficiency
          Color eff_color = id(color_red);
          if (efficiency > 95) eff_color = id(color_green);
          else if (efficiency > 90) eff_color = id(color_yellow);
          else if (efficiency > 85) eff_color = id(color_orange);

          it.printf(250, 125, id(font_small), eff_color, TextAlign::LEFT,
                    "η:%.1f%%", efficiency);

          // === ENERGY TOTALS SECTION (Bottom) ===
          it.print(10, 185, id(font_small), id(color_blue), TextAlign::LEFT,
                   "ENERGY PRODUCTION");

          // Today's energy with bar graph
          it.print(10, 205, id(font_small), id(color_white), TextAlign::LEFT,
                   "Today:");
          it.printf(65, 205, id(font_medium), id(color_green), TextAlign::LEFT,
                    "%.2f kWh", id(today_energy).state);

          // Visual bar for today's production (0-30 kWh scale)
          float bar_width = (id(today_energy).state / 30.0) * 200;
          if (bar_width > 200) bar_width = 200;
          it.filled_rectangle(10, 225, bar_width, 8, id(color_green));
          it.rectangle(10, 225, 200, 8, id(color_gray));

          // Total lifetime energy
          it.printf(220, 205, id(font_small), id(color_gray), TextAlign::LEFT,
                    "Total: %.0f kWh", id(total_energy).state);

          // === STATUS BAR (Very Bottom) ===
          // Temperature indicator with color coding
          float temp = id(inverter_temp).state;
          Color temp_color = id(color_green);
          if (temp > 60) temp_color = id(color_red);
          else if (temp > 50) temp_color = id(color_orange);
          else if (temp > 40) temp_color = id(color_yellow);

          it.printf(10, 238, id(font_tiny), temp_color, TextAlign::LEFT,
                    "Temp: %.1f°C", temp);

          // Connection status indicator
          if (id(inverter_status).state) {
            it.filled_circle(295, 235, 5, id(color_green));
          } else {
            it.filled_circle(295, 235, 5, id(color_red));
          }

          // Current time
          it.strftime(160, 238, id(font_tiny), id(color_gray), TextAlign::CENTER,
                      "%H:%M", id(esptime).now());

      # System info page
      - id: stats_page
        lambda: |-
          // System statistics and network info
          it.fill(Color(0, 0, 0));
          it.print(160, 15, id(font_medium), id(color_white), TextAlign::CENTER,
                   "SYSTEM INFO");

          it.print(10, 50, id(font_small), id(color_cyan), TextAlign::LEFT,
                   "Network:");
          it.printf(10, 70, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "SSID: %s", id(wifi_ssid).state.c_str());
          it.printf(10, 85, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "IP: %s", id(wifi_ip).state.c_str());

          it.print(10, 110, id(font_small), id(color_cyan), TextAlign::LEFT,
                   "Inverter:");
          it.printf(10, 130, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "Model: Zeversolar TLC5000");
          it.printf(10, 145, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "Status: %s", id(inverter_status).state ? "Online" : "Offline");
          it.printf(10, 160, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "Temp: %.1f°C", id(inverter_temp).state);

          it.print(10, 185, id(font_small), id(color_cyan), TextAlign::LEFT,
                   "Device:");
          it.printf(10, 205, id(font_tiny), id(color_white), TextAlign::LEFT,
                    "Uptime: %.1f hours", id(device_uptime).state / 3600.0);

          it.strftime(160, 238, id(font_tiny), id(color_gray), TextAlign::CENTER,
                      "%Y-%m-%d %H:%M:%S", id(esptime).now());

# Touchscreen (FT6336U) - Now with page switching
touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch at (%d, %d)", touch.x, touch.y);
          // Switch pages on touch
          id(m5_display).show_next_page();

# Fonts for Display
font:
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 10

  - file: "gfonts://Roboto"
    id: font_small
    size: 12

  - file: "gfonts://Roboto"
    id: font_medium
    size: 16

  - file: "gfonts://Roboto@700"
    id: font_large
    size: 24

# Define colors for visual organization
color:
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%

  - id: color_black
    red: 0%
    green: 0%
    blue: 0%

  - id: color_green
    red: 0%
    green: 100%
    blue: 0%

  - id: color_red
    red: 100%
    green: 0%
    blue: 0%

  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%

  - id: color_orange
    red: 100%
    green: 65%
    blue: 0%

  - id: color_blue
    red: 30%
    green: 60%
    blue: 100%

  - id: color_cyan
    red: 0%
    green: 100%
    blue: 100%

  - id: color_gray
    red: 50%
    green: 50%
    blue: 50%

  - id: color_bright
    red: 100%
    green: 100%
    blue: 100%

  - id: color_header
    red: 20%
    green: 30%
    blue: 60%

# Time Component (for display)
time:
  - platform: homeassistant
    id: esptime

# Text Sensors for network info
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      id: wifi_ip
    ssid:
      name: "${friendly_name} SSID"
      id: wifi_ssid

# Speaker Output (NS4168)
output:
  - platform: ledc
    pin: GPIO25
    id: speaker_output

  - platform: ledc
    pin: GPIO19
    id: gpio_led

# RTTTL Buzzer for Speaker
rtttl:
  output: speaker_output
  on_finished_playback:
    - logger.log: "Song finished!"

# LED
light:
  - platform: monochromatic
    output: gpio_led
    name: "${friendly_name} LED"

# Switches and Buttons
switch:
  - platform: restart
    name: "${friendly_name} Restart"

button:
  - platform: template
    name: "${friendly_name} Next Display Page"
    on_press:
      then:
        - display.page.show_next: m5_display
